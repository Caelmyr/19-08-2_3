<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoEdit - 协作编辑器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f7fa;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  
  .toolbar {
    background: white;
    padding: 12px 24px;
    border-bottom: 1px solid #e8ecf1;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .toolbar-left { display: flex; align-items: center; gap: 16px; }
  .toolbar-right { display: flex; align-items: center; gap: 12px; }
  .back-btn {
    color: #666;
    text-decoration: none;
    font-size: 14px;
  }
  .back-btn:hover { color: #4361ee; }
  .doc-title {
    font-size: 18px;
    font-weight: 600;
    color: #1a1a2e;
  }
  .version-badge {
    background: #e8ecf1;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    color: #666;
  }
  .status-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #999;
    display: inline-block;
    margin-right: 6px;
  }
  .status-indicator.connected { background: #2ecc71; }
  .status-indicator.disconnected { background: #e74c3c; }
  
  .users-panel {
    display: flex;
    gap: 8px;
  }
  .user-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 16px;
    font-size: 12px;
    background: white;
    border: 2px solid;
  }
  .user-chip .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  
  .editor-wrapper {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
  }
  
  .cursors-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .remote-cursor {
    position: absolute;
    width: 2px;
    transition: top 0.15s, left 0.15s;
    z-index: 10;
  }
  .remote-cursor-label {
    position: absolute;
    top: -18px;
    left: -1px;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 3px;
    color: white;
    white-space: nowrap;
  }
  
  #editor {
    width: 100%;
    height: 100%;
    padding: 32px 64px;
    font-size: 16px;
    line-height: 1.7;
    border: none;
    outline: none;
    resize: none;
    font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
    background: white;
  }
  
  .sidebar {
    width: 240px;
    background: white;
    border-left: 1px solid #e8ecf1;
    padding: 16px;
    overflow-y: auto;
  }
  .sidebar h3 {
    font-size: 14px;
    color: #666;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .sidebar p {
    font-size: 12px;
    color: #999;
    line-height: 1.6;
    margin-bottom: 8px;
  }
  
  .footer-bar {
    background: white;
    padding: 8px 24px;
    border-top: 1px solid #e8ecf1;
    font-size: 12px;
    color: #999;
    display: flex;
    justify-content: space-between;
  }
  
  .user-count {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ===== 跟随功能 ===== */
  .follow-bar {
    background: #4361ee;
    color: white;
    padding: 8px 24px;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .follow-bar b { font-weight: 600; }
  .unfollow-btn {
    background: rgba(255,255,255,0.2);
    color: white;
    border: 1px solid rgba(255,255,255,0.5);
    padding: 4px 14px;
    border-radius: 14px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .unfollow-btn:hover { background: rgba(255,255,255,0.35); }

  .follower-badge {
    background: #fff3cd;
    color: #856404;
    border: 1px solid #ffeeba;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
  }

  .follow-btn {
    margin-left: auto;
    border: 1px solid #d0d5dd;
    background: #f8f9fb;
    color: #4361ee;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 11px;
    cursor: pointer;
  }
  .follow-btn:hover { background: #4361ee; color: white; }
  .follow-btn.active {
    background: #4361ee;
    color: white;
    border-color: #4361ee;
  }

  /* 被跟随者的光标高亮 */
  .remote-cursor.followed {
    width: 3px;
    box-shadow: 0 0 6px 1px currentColor;
    z-index: 11;
  }
  .remote-cursor.followed .remote-cursor-label {
    animation: followPulse 1.6s ease-in-out infinite;
  }
  @keyframes followPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  .toast {
    position: fixed;
    top: 64px;
    left: 50%;
    transform: translateX(-50%) translateY(-16px);
    background: #1a1a2e;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 100;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-left">
    <a href="/" class="back-btn">← 返回文档列表</a>
    <div class="doc-title" id="docTitle">加载中...</div>
  </div>
  <div class="toolbar-right">
    <span class="follower-badge" id="followerBadge" style="display:none">👀 <span id="followerNum">0</span> 人正在跟随你</span>
    <div class="version-badge">v<span id="version">0</span></div>
    <div class="status-indicator" id="status"></div>
    <span id="statusText">连接中...</span>
  </div>
</div>

<div class="follow-bar" id="followBar" style="display:none">
  <span>👁 正在跟随 <b id="followName"></b> —— 视图将同步对方的滚动和光标，你自己滚动不会打断跟随</span>
  <button class="unfollow-btn" onclick="unfollow()">退出跟随</button>
</div>

<div class="editor-wrapper">
  <div class="cursors-layer" id="cursorsLayer"></div>
  <textarea id="editor" spellcheck="false" placeholder="开始输入..."></textarea>
  <div class="sidebar">
    <h3>在线用户</h3>
    <div class="users-panel" id="usersPanel"></div>
    <h3 style="margin-top:24px;">协作提示</h3>
    <p>👋 多人可以同时编辑此文档</p>
    <p>🎨 不同颜色代表不同用户的光标位置</p>
    <p>👁 点击用户右侧「跟随」可实时同步对方视野，适合演示讲解</p>
    <p>💾 所有更改自动保存到服务器</p>
    <p>🔄 支持版本历史和回滚</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="footer-bar">
  <div class="user-count">
    👥 在线: <span id="userCount">0</span> 人
  </div>
  <div>CoEdit OT 实时协作引擎</div>
</div>

<script>
// ========== 状态管理 ==========
const params = new URLSearchParams(window.location.search);
const docId = params.get('doc_id');
const username = params.get('username') || '用户-' + Math.random().toString(36).slice(2, 6);

let state = {
  content: '',
  version: 0,
  clientId: null,
  color: '#4361ee',
  cursorPosition: 0,
  remoteCursors: {},
  users: [],
  ws: null,
  reconnectAttempts: 0,
  pendingOps: [],   // 本地已发送但未ack的操作
  sendTimer: null,
  // 跟随状态：targetId 已确认的跟随目标，pendingId 等待ack的目标
  follow: { targetId: null, targetName: '', pendingId: null, savedView: null },
  followerCount: 0, // 正在跟随我的人数（>0 时才上报自己的视野）
};

const editor = document.getElementById('editor');
const cursorsLayer = document.getElementById('cursorsLayer');
const versionEl = document.getElementById('version');
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
const usersPanel = document.getElementById('usersPanel');
const userCount = document.getElementById('userCount');
const docTitle = document.getElementById('docTitle');

// ========== 初始化 ==========
async function init() {
  // 加载文档
  await loadDocument();
  // 建立WebSocket连接
  connectWS();
  // 监听编辑事件
  editor.addEventListener('input', onInput);
  editor.addEventListener('keyup', onCursorMove);
  editor.addEventListener('mouseup', onCursorMove);
  editor.addEventListener('scroll', onEditorScroll);
  window.addEventListener('resize', renderCursors);
}

async function loadDocument() {
  try {
    const res = await fetch(`/api/documents/${docId}/snapshot`);
    const data = await res.json();
    state.content = data.content || '';
    state.version = data.version || 0;
    editor.value = state.content;
    versionEl.textContent = state.version;
    
    // 获取文档标题
    const docRes = await fetch(`/api/documents/${docId}`);
    const docData = await docRes.json();
    docTitle.textContent = docData.title || '未命名文档';
  } catch (e) {
    console.error('加载文档失败:', e);
  }
}

// ========== WebSocket ==========
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/ws?doc_id=${docId}&username=${encodeURIComponent(username)}`;
  
  state.ws = new WebSocket(url);
  
  state.ws.onopen = () => {
    console.log('WebSocket 已连接');
    statusEl.className = 'status-indicator connected';
    statusText.textContent = '已连接';
    state.reconnectAttempts = 0;
  };
  
  state.ws.onclose = () => {
    console.log('WebSocket 断开');
    statusEl.className = 'status-indicator disconnected';
    statusText.textContent = '重连中...';
    // 自动重连
    setTimeout(() => {
      state.reconnectAttempts++;
      if (state.reconnectAttempts < 10) {
        connectWS();
      }
    }, Math.min(1000 * state.reconnectAttempts, 10000));
  };
  
  state.ws.onerror = (e) => {
    console.error('WebSocket 错误:', e);
  };
  
  state.ws.onmessage = onMessage;
}

function onMessage(event) {
  try {
    const msg = JSON.parse(event.data);
    
    switch (msg.type) {
      case 'init':
        handleInit(msg);
        break;
      case 'op':
        handleRemoteOp(msg);
        break;
      case 'ack':
        handleAck(msg);
        break;
      case 'cursor_move':
        handleCursorMove(msg);
        break;
      case 'user_join':
        handleUserJoin(msg);
        break;
      case 'user_leave':
        handleUserLeave(msg);
        break;
      case 'viewport':
        handleViewport(msg);
        break;
      case 'follow_ack':
        handleFollowAck(msg);
        break;
      case 'follow_end':
        handleFollowEnd(msg);
        break;
      case 'follow_info':
        handleFollowInfo(msg);
        break;
      case 'error':
        console.error('服务器错误:', msg.error);
        // 跟随请求被拒绝（如目标刚离开），清理待定的跟随状态
        if (state.follow.pendingId) {
          clearFollowState();
          updateFollowUI();
          showToast('跟随失败：' + (msg.error || '对方已离开'));
        }
        break;
    }
  } catch (e) {
    console.error('解析消息失败:', e);
  }
}

function handleInit(msg) {
  // 重连后会拿到新的 client_id，旧的跟随关系在服务端已失效
  if (state.follow.targetId || state.follow.pendingId) {
    showToast('连接已重置，跟随已结束');
  }
  clearFollowState();
  state.followerCount = 0;
  updateFollowUI();

  state.clientId = msg.client_id;
  state.color = msg.color;
  
  // 使用服务器的内容（可能比我们加载的更新）
  if (msg.content !== undefined) {
    state.content = msg.content;
    editor.value = msg.content;
  }
  if (msg.version !== undefined) {
    state.version = msg.version;
    versionEl.textContent = msg.version;
  }
  
  // 添加已有用户
  if (msg.users) {
    state.users = msg.users.filter(u => u.client_id !== state.clientId);
    renderUsers();
  }
  
  // 渲染已有光标
  if (msg.cursors) {
    msg.cursors.forEach(c => {
      if (c.client_id !== state.clientId) {
        state.remoteCursors[c.client_id] = { ...c };
      }
    });
    renderCursors();
  }
  
  console.log('初始化完成, clientId:', state.clientId, 'version:', state.version);
}

function handleRemoteOp(msg) {
  // 接收来自其他客户端的操作
  const op = msg.op;
  console.log('收到远端op:', op, 'version:', msg.version);
  
  // 应用到本地
  applyOpToEditor(op);
  
  state.version = msg.version;
  versionEl.textContent = state.version;
}

function handleAck(msg) {
  // 服务器确认我们的操作
  console.log('收到ack, version:', msg.version);
  state.version = msg.version;
  versionEl.textContent = msg.version;
  // 清除对应的pang操作
  state.pendingOps = state.pendingOps.filter(o => o.version !== msg.version);
}

function handleCursorMove(msg) {
  if (msg.client_id === state.clientId) return;
  
  state.remoteCursors[msg.client_id] = {
    client_id: msg.client_id,
    username: msg.username,
    position: msg.position,
    color: msg.color
  };
  renderCursors();
}

function handleUserJoin(msg) {
  if (msg.client_id === state.clientId) return;
  
  if (!state.users.find(u => u.client_id === msg.client_id)) {
    state.users.push({
      client_id: msg.client_id,
      username: msg.username,
      color: msg.color
    });
  }
  renderUsers();
}

function handleUserLeave(msg) {
  state.users = state.users.filter(u => u.client_id !== msg.client_id);
  delete state.remoteCursors[msg.client_id];
  // 兜底：若被跟随者离开（正常会先收到 follow_end，此处幂等）
  if (state.follow.targetId === msg.client_id || state.follow.pendingId === msg.client_id) {
    clearFollowState(); // 不恢复位置：视图停留在最后位置
    updateFollowUI();
    showToast(`${msg.username} 已离开，跟随结束，视图停留在最后位置`);
  }
  renderUsers();
  renderCursors();
}

// ========== 用户列表渲染 ==========
function renderUsers() {
  usersPanel.innerHTML = state.users.map(u => {
    const isFollowing = state.follow.targetId === u.client_id || state.follow.pendingId === u.client_id;
    return `
    <div class="user-chip" style="border-color:${u.color}">
      <div class="dot" style="background:${u.color}"></div>
      ${escapeHtml(u.username)}
      <button class="follow-btn ${isFollowing ? 'active' : ''}" onclick="toggleFollow('${u.client_id}')">
        ${isFollowing ? '跟随中' : '跟随'}
      </button>
    </div>`;
  }).join('');
  userCount.textContent = state.users.length + 1; // +1 自己
}

// ========== 光标渲染 ==========
function renderCursors() {
  // 清空
  cursorsLayer.innerHTML = '';
  
  Object.values(state.remoteCursors).forEach(cursor => {
    const pos = cursor.position;
    if (pos < 0 || pos > editor.value.length) return;
    
    // 计算位置（简化：按字符位置计算）
    const posInfo = getCaretCoordinates(editor, pos);
    
    const el = document.createElement('div');
    el.className = 'remote-cursor';
    if (cursor.client_id === state.follow.targetId) {
      el.classList.add('followed'); // 高亮被跟随者的光标
      el.style.color = cursor.color;
    }
    el.style.background = cursor.color;
    el.style.top = posInfo.top + 'px';
    el.style.left = posInfo.left + 'px';
    el.style.height = posInfo.height + 'px';
    
    const label = document.createElement('div');
    label.className = 'remote-cursor-label';
    label.style.background = cursor.color;
    label.textContent = cursor.username;
    el.appendChild(label);
    
    cursorsLayer.appendChild(el);
  });
}

// 获取光标在textarea中的像素位置
function getCaretCoordinates(element, position) {
  // 创建一个镜像元素来计算位置
  const mirror = document.createElement('div');
  const style = window.getComputedStyle(element);
  
  // 复制样式
  const props = ['boxSizing', 'width', 'height', 'overflowX', 'overflowY',
    'borderTopWidth', 'borderRightWidth', 'borderBottomWidth', 'borderLeftWidth',
    'borderStyle', 'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft',
    'fontStyle', 'fontVariant', 'fontWeight', 'fontStretch', 'fontSize',
    'fontSizeAdjust', 'lineHeight', 'fontFamily',
    'textAlign', 'textTransform', 'textIndent', 'textDecoration',
    'letterSpacing', 'wordSpacing', 'tabSize'];
  
  props.forEach(p => {
    mirror.style[p] = style[p];
  });
  
  mirror.style.position = 'absolute';
  mirror.style.top = '0';
  mirror.style.left = '0';
  mirror.style.visibility = 'hidden';
  mirror.style.whiteSpace = 'pre-wrap';
  mirror.style.wordWrap = 'break-word';
  
  // 设置内容
  const text = element.value.substring(0, position);
  const afterText = element.value.substring(position);
  mirror.textContent = text;
  
  const span = document.createElement('span');
  span.textContent = afterText || '.';
  mirror.appendChild(span);
  
  document.body.appendChild(mirror);
  
  const rect = element.getBoundingClientRect();
  const mirrorRect = mirror.getBoundingClientRect();
  const spanRect = span.getBoundingClientRect();
  
  document.body.removeChild(mirror);
  
  return {
    top: spanRect.top - mirrorRect.top - element.scrollTop,
    left: spanRect.left - mirrorRect.left - element.scrollLeft,
    height: parseInt(style.lineHeight) || parseInt(style.fontSize) * 1.2,
    width: 2
  };
}

// ========== 编辑器操作 ==========
function onInput(e) {
  // 计算差异，发送OT操作
  const newContent = editor.value;
  const oldContent = state.content;
  
  if (newContent === oldContent) return;
  
  const op = diffContent(oldContent, newContent);
  if (!op) return;
  
  // 发送操作（带base_version）
  sendOp(op, state.version);
  state.content = newContent;
}

function onCursorMove() {
  state.cursorPosition = editor.selectionStart;
  sendCursorPosition(state.cursorPosition);
  renderCursors();
  maybeSendViewport();
}

function onEditorScroll() {
  renderCursors();
  maybeSendViewport();
}

function diffContent(oldContent, newContent) {
  // 简单的差异计算
  if (newContent.length > oldContent.length) {
    // 插入
    let diffStart = 0;
    while (diffStart < oldContent.length && diffStart < newContent.length) {
      if (oldContent[diffStart] !== newContent[diffStart]) break;
      diffStart++;
    }
    let diffEndOld = oldContent.length;
    let diffEndNew = newContent.length;
    while (diffEndOld > diffStart && diffEndNew > diffStart) {
      if (oldContent[diffEndOld - 1] !== newContent[diffEndNew - 1]) break;
      diffEndOld--;
      diffEndNew--;
    }
    
    // 在公共前缀之后有删除+插入
    const deletedText = oldContent.substring(diffStart, diffEndOld);
    const insertedText = newContent.substring(diffStart, diffEndNew);
    
    if (deletedText.length > 0) {
      return {
        operations: [
          { type: 'delete', position: diffStart, length: deletedText.length },
          { type: 'insert', position: diffStart, text: insertedText }
        ]
      };
    } else {
      return {
        operations: [
          { type: 'insert', position: diffStart, text: insertedText }
        ]
      };
    }
  } else if (newContent.length < oldContent.length) {
    // 删除
    let diffStart = 0;
    while (diffStart < oldContent.length && diffStart < newContent.length) {
      if (oldContent[diffStart] !== newContent[diffStart]) break;
      diffStart++;
    }
    
    let diffEndOld = oldContent.length;
    let diffEndNew = newContent.length;
    while (diffEndOld > diffStart && diffEndNew > diffStart) {
      if (oldContent[diffEndOld - 1] !== newContent[diffEndNew - 1]) break;
      diffEndOld--;
      diffEndNew--;
    }
    
    const deletedText = oldContent.substring(diffStart, diffEndOld);
    const insertedText = newContent.substring(diffStart, diffEndNew);
    
    if (insertedText.length > 0) {
      return {
        operations: [
          { type: 'delete', position: diffStart, length: deletedText.length },
          { type: 'insert', position: diffStart, text: insertedText }
        ]
      };
    } else {
      return {
        operations: [
          { type: 'delete', position: diffStart, length: deletedText.length }
        ]
      };
    }
  }
  return null;
}

function applyOpToEditor(op) {
  const operations = op.operations || [op];
  
  operations.forEach(o => {
    if (o.type === 'insert') {
      insertText(o.position, o.text);
    } else if (o.type === 'delete') {
      deleteText(o.position, o.length);
    }
  });
  
  state.content = editor.value;
}

function insertText(pos, text) {
  const before = editor.value.substring(0, pos);
  const after = editor.value.substring(pos);
  editor.value = before + text + after;
}

function deleteText(pos, length) {
  const before = editor.value.substring(0, pos);
  const after = editor.value.substring(pos + length);
  editor.value = before + after;
}

function sendOp(op, baseVersion) {
  if (!state.ws || state.ws.readyState !== WebSocket.OPEN) return;
  
  const msg = {
    type: 'op',
    doc_id: docId,
    op: op.operations && op.operations.length === 1 ? op.operations[0] : op,
    base_version: baseVersion,
    version: baseVersion
  };
  
  // 如果是多操作序列，逐个发送
  if (op.operations && op.operations.length > 1) {
    op.operations.forEach((singleOp, i) => {
      const singleMsg = { ...msg, op: singleOp };
      state.ws.send(JSON.stringify(singleMsg));
    });
  } else {
    state.ws.send(JSON.stringify(msg));
  }
}

function sendCursorPosition(pos) {
  if (!state.ws || state.ws.readyState !== WebSocket.OPEN) return;

  const msg = {
    type: 'cursor_move',
    doc_id: docId,
    position: pos
  };
  state.ws.send(JSON.stringify(msg));
}

// ========== 跟随功能 ==========
// 视野上报：仅当有人跟随我时才发送，80ms 节流
let viewportTimer = null;
function maybeSendViewport() {
  if (state.followerCount === 0) return;
  if (viewportTimer) return;
  viewportTimer = setTimeout(() => {
    viewportTimer = null;
    sendViewport();
  }, 80);
}

function sendViewport() {
  if (!state.ws || state.ws.readyState !== WebSocket.OPEN) return;
  if (state.followerCount === 0) return;
  state.ws.send(JSON.stringify({
    type: 'viewport',
    doc_id: docId,
    position: editor.selectionStart,
    scroll_top: editor.scrollTop,
    scroll_left: editor.scrollLeft
  }));
}

// 点击用户旁的跟随按钮：跟随 / 取消跟随
function toggleFollow(clientId) {
  if (state.follow.targetId === clientId || state.follow.pendingId === clientId) {
    unfollow();
  } else {
    startFollow(clientId);
  }
}

function startFollow(targetId) {
  const target = state.users.find(u => u.client_id === targetId);
  if (!target) return;
  if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
    showToast('连接未就绪，无法跟随');
    return;
  }

  // 仅在未跟随状态时记录自己的位置，供主动解除跟随后恢复
  //（换跟随目标时保留最初的位置）
  if (!state.follow.targetId && !state.follow.pendingId) {
    state.follow.savedView = {
      scrollTop: editor.scrollTop,
      scrollLeft: editor.scrollLeft,
      cursor: editor.selectionStart
    };
  }
  state.follow.pendingId = targetId;
  state.follow.targetName = target.username;
  state.ws.send(JSON.stringify({ type: 'follow', doc_id: docId, target_id: targetId }));
  updateFollowUI();
  renderUsers();
}

// 主动解除跟随：回到自己原来的位置
function unfollow() {
  if (!state.follow.targetId && !state.follow.pendingId) return;
  if (state.ws && state.ws.readyState === WebSocket.OPEN) {
    state.ws.send(JSON.stringify({ type: 'unfollow', doc_id: docId }));
  }
  const saved = state.follow.savedView;
  clearFollowState();
  if (saved) {
    editor.scrollTop = saved.scrollTop;
    editor.scrollLeft = saved.scrollLeft;
    editor.setSelectionRange(saved.cursor, saved.cursor);
  }
  updateFollowUI();
  renderUsers();
  showToast('已退出跟随，回到你原来的位置');
}

function clearFollowState() {
  state.follow.targetId = null;
  state.follow.pendingId = null;
  state.follow.savedView = null;
  state.follow.targetName = '';
}

// 跟随确认：立即对齐到被跟随者当前视野
function handleFollowAck(msg) {
  state.follow.targetId = msg.target_id;
  state.follow.pendingId = null;
  state.follow.targetName = msg.username;
  applyViewport(msg.target_id, msg);
  updateFollowUI();
  renderUsers();
  showToast(`正在跟随 ${msg.username}`);
}

// 收到被跟随者的视野更新：同步滚动位置和光标
function handleViewport(msg) {
  if (msg.client_id !== state.follow.targetId) return;
  applyViewport(msg.client_id, msg);
}

// 应用视野：所有跟随者应用同样的值，因此看到同样的画面
function applyViewport(targetId, msg) {
  state.remoteCursors[targetId] = {
    client_id: targetId,
    username: msg.username,
    position: msg.position || 0,
    color: msg.color
  };
  if (msg.scroll_top !== undefined) editor.scrollTop = msg.scroll_top;
  if (msg.scroll_left !== undefined) editor.scrollLeft = msg.scroll_left;
  renderCursors();
}

// 被跟随者断线/退出：提示并停在最后位置（不恢复原位置）
function handleFollowEnd(msg) {
  if (state.follow.targetId !== msg.target_id && state.follow.pendingId !== msg.target_id) return;
  clearFollowState();
  updateFollowUI();
  renderUsers();
  showToast(`${msg.username} 已离开，跟随结束，视图停留在最后位置`);
}

// 自己的跟随者人数变化
function handleFollowInfo(msg) {
  state.followerCount = msg.followers || 0;
  updateFollowUI();
}

function updateFollowUI() {
  const bar = document.getElementById('followBar');
  const nameEl = document.getElementById('followName');
  const badge = document.getElementById('followerBadge');

  if (state.follow.targetId) {
    bar.style.display = 'flex';
    nameEl.textContent = state.follow.targetName;
  } else if (state.follow.pendingId) {
    bar.style.display = 'flex';
    nameEl.textContent = state.follow.targetName + '（连接中…）';
  } else {
    bar.style.display = 'none';
  }

  if (state.followerCount > 0) {
    badge.style.display = 'inline-block';
    document.getElementById('followerNum').textContent = state.followerCount;
  } else {
    badge.style.display = 'none';
  }
}

let toastTimer = null;
function showToast(text) {
  const toast = document.getElementById('toast');
  toast.textContent = text;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// 启动
init();
</script>
</body>
</html>
